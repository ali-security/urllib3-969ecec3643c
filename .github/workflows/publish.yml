name: Publish to PyPI

on: workflow_dispatch

permissions:
  contents: "read"

jobs:
  build:
    name: "Build distribution 📦"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: "Install dependencies"
        run: python -m pip install build==0.8.0

      # The public 2.7.0 wheel's "Generator:" line is "hatchling 1.29.0".
      # "python -m build" stays isolated and verbatim: PEP 517 isolation installs
      # the backend with pip, which honors PIP_CONSTRAINT.
      - name: "Pin build backend"
        run: |
          printf 'hatchling==1.29.0\n' > build-constraints.txt

      - name: "Build dists"
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          # This fork carries extra commits on top of the 2.7.0 tag, so hatch-vcs
          # would compute "2.7.1.dev N". The *unqualified* variable is the only
          # one honored here (SETUPTOOLS_SCM_PRETEND_VERSION_FOR_URLLIB3 and
          # HATCH_VCS_PRETEND_VERSION are not).
          SETUPTOOLS_SCM_PRETEND_VERSION: "2.7.0"
        run: |
          # 1778169707 is `git log -1 --pretty=%ct 2.7.0`; the upstream
          # $(git log -1 --pretty=%ct) would read our patch commit instead.
          SOURCE_DATE_EPOCH=1778169707 \
          python -m build

      - name: "Generate hashes"
        id: hash
        run: |
          cd dist && echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

      - name: "Upload dists"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        id: upload-artifact
        with:
          name: "dist"
          path: "dist/"
          if-no-files-found: error
          retention-days: 5
