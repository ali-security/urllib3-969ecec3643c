name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated pytest targets. Empty runs the whole suite."
        required: false
        default: ""

permissions:
  contents: "read"

defaults:
  run:
    shell: bash
env:
  FORCE_COLOR: 1

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: "Check packages"
        run: |
          python -m pip install -U pip setuptools wheel build twine rstcheck
          python -m build
          rstcheck --ignore-messages "(Duplicate implicit target name:.*)" CHANGES.rst
          python -m twine check dist/*

  test:
    strategy:
      fail-fast: false
      matrix:
        # "3.15" kept in: Python 3.15 is pre-release and upstream-experimental,
        # but this build runs its leg instead of dropping it.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
        os:
          - macos-15
          - windows-latest
          - ubuntu-24.04
        # Empty nox-session, so NOX_SESSION falls back to test-<python-version>.
        nox-session: ['']
        container: ['']
        include:
          # Integration tests. These are NOT real external services: the nox
          # session runs pytest with --disable-socket and
          # --allow-hosts=localhost,127.0.0.1,::1,127.0.0.0,240.0.0.0, i.e.
          # loopback plus the 240.0.0.0 tarpit used for connect-timeout tests.
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: test_integration
          # Pinned-patch leg: 3.12.2 exercises urllib3/urllib3#3620.
          - python-version: "3.12.2"
            os: ubuntu-24.04
            nox-session: test-3.12
          # Alternate implementations: PyPy.
          # Nightly should be used until PyPy v7.3.23 is released.
          # https://github.com/python-trio/trio/issues/3433#issuecomment-4349552625
          # Nightly is a moving target, so pin instead to the PyPy release
          # verified for urllib3 2.6.3 (upstream used "pypy-3.11-nightly"): 7.3.20
          # predates the 7.3.22 regression, and "pypy-3.11" now resolves to
          # PyPy 8.0.0, whose io stack raises BufferError in
          # test_ssltransport::test_tls_in_tls_makefile_rw_text.
          - python-version: "pypy3.11-v7.3.20"
            os: ubuntu-24.04
            nox-session: test-pypy3.11
          # Test with the minimum supported pyOpenSSL for OpenSSL 1.1.1.
          # Debian Bullseye was the last release with OpenSSL 1.1.1, and
          # 3.13-bullsey was the last published image.
          # setup-python (and so the pyver pin) is skipped in the container;
          # the image's own 3.13 is used.
          - python-version: "3.13"
            os: ubuntu-24.04
            container: python:3.13-bullseye
            nox-session: test_min_pyopenssl
          # brotlipy installed instead of brotli/brotlicffi.
          - python-version: "3.x"
            os: ubuntu-24.04
            nox-session: test_brotlipy
          # Emscripten / Pyodide legs (wasm): fetch a Pyodide build and drive a
          # real node / firefox / chrome runtime. Slower than the CPython legs.
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(node)
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(firefox)
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(chrome)
          # The upstream 3.15 include entry only set experimental: true, a field
          # this build no longer uses; 3.15 now runs via the base matrix above.

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ fromJson('{"macos-15":"macOS","windows-latest":"Windows","ubuntu-24.04":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }} ${{ matrix.nox-session}}
    # Raised from upstream's 10: the emscripten (Pyodide + browser) legs are slow,
    # and the 5-attempt retry loop needs headroom to re-run a flaky leg.
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      # Pin CPython to the same release-era patch releases verified for the
      # urllib3 2.6.x line (2.6.3, 2026-01-07); urllib3 2.7.0 shipped
      # 2026-05-07. Newer ones changed behavior the test suite predates:
      # 3.13.16/3.14.8 zlib decompressobj.flush() raises on trailing garbage
      # (test_chunked_decoding_gzip_swallow_garbage); later security releases
      # raise "check_hostname requires server_hostname" in wrap_socket before
      # touching the socket (test_start_closed_socket); and 3.15.0 final makes
      # the noxfile pass --memray while pytest-memray is only installed for
      # <3.15. 3.15 was still pre-release when 2.7.0 shipped, so an alpha is
      # the faithful pin. matrix.python-version itself stays unchanged so job
      # names and nox session names (test-<python-version>) are untouched.
      # Unmapped values (3.12.2, pypy3.11-v7.3.20) pass through unchanged.
      - name: "Resolve release-era Python version"
        id: pyver
        shell: bash
        env:
          PYVER: ${{ matrix.python-version }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          v="$PYVER"
          case "$PYVER" in
            3.13) v=3.13.11 ;;
            3.14) v=3.14.2 ;;
            3.14t) v=3.14.2t ;;
            3.15) v=3.15.0-alpha.3 ;;
            3.x) v=3.14.2 ;;
          esac
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            case "$PYVER" in
              3.10) v=3.10.19 ;;
              3.11) v=3.11.14 ;;
              3.12) v=3.12.12 ;;
            esac
          fi
          echo "Resolved $PYVER -> $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        # pip will emit a warning about running as root if setup-python
        # is used in a container.
        if: ${{ matrix.container == '' }}
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          allow-prereleases: true

      - name: "Install uv"
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: "Install Chrome"
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded # v2.1.1
        id: setup-chrome
        if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
        with:
          install-chromedriver: true
          chrome-version: canary
      - name: Force override system chrome
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          sudo rm -f /usr/bin/google-chrome
          sudo rm -f /usr/bin/chrome
          sudo ln -s $CHROME_PATH /usr/bin/google-chrome
          sudo ln -s $CHROME_PATH /usr/bin/chrome
          google-chrome --version
        if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
      - name: "Install Firefox"
        uses: browser-actions/setup-firefox@fcf821c621167805dd63a29662bd7cb5676c81a8 # v1.7.1
        if: ${{ matrix.nox-session == 'emscripten(firefox)' }}
      - name: "Install node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ matrix.nox-session == 'emscripten(node)' }}
        with:
          node-version: 22
      - name: Cache pyodide downloads in nox cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        if: ${{ startsWith(matrix.nox-session, 'emscripten') }}
        with:
          path: .nox/.cache
          # noxfile.py contains the Pyodide version used currently.
          key: pyodide-downloads-${{ hashFiles('noxfile.py') }}

      # Windows-only skip, injected via PYTEST_ADDOPTS (picked up automatically
      # inside the nox session) instead of patching the test source tree. This
      # is NOT a flake: Winsock does not raise OSError from settimeout() after a
      # peer reset, so TestSSL::test_ssl_custom_validation_failure_terminates
      # can never pass on Windows and retrying cannot help.
      - name: "Skip Winsock teardown test on Windows"
        if: runner.os == 'Windows'
        run: |
          echo 'PYTEST_ADDOPTS=--deselect test/with_dummyserver/test_socketlevel.py::TestSSL::test_ssl_custom_validation_failure_terminates' >> "$GITHUB_ENV"

      # Firefox-emscripten-only skip. The `[firefox-False]` (prefer_jspi=False)
      # tests assert has_jspi() is False, but every Firefox >= 139 ships the JSPI
      # API so has_jspi() is True there, and urllib3's harness only has a JSPI
      # disable hook for chrome, not firefox. These are therefore deterministic
      # failures, not flakes (retry cannot help); the no-JSPI code path they
      # cover is still exercised by the node and chrome legs. Deselected here
      # rather than patched out of the test source.
      - name: "Skip JSPI-off tests on Firefox emscripten"
        if: ${{ matrix.nox-session == 'emscripten(firefox)' }}
        run: |
          base="test/contrib/emscripten/test_emscripten.py"
          addopts=""
          for t in test_break_worker_streaming test_has_jspi test_has_jspi_worker \
                   test_index test_pool_requests test_streaming_close \
                   test_streaming_download test_streaming_fallback_warning \
                   test_timeout_warning; do
            addopts="$addopts --deselect ${base}::${t}[firefox-False]"
          done
          echo "PYTEST_ADDOPTS=$addopts" >> "$GITHUB_ENV"

      - name: "Run tests"
        # Retry the session up to 5 times: a flaky failure (e.g. the borderline
        # pytest-memray ceiling on test_buffer_memory_usage_no_decoding, or a
        # rare signal-timing hiccup in test_wait) passes on a later attempt
        # instead of reddening the matrix. A deterministic failure fails all 5
        # attempts, so this cannot mask a real regression.
        run: |
          for attempt in 1 2 3 4 5; do
            echo "pytest attempt ${attempt}/5"
            if [ -n "$TEST_FILTER" ]; then
              uvx nox -s "$NOX_SESSION" -- $TEST_FILTER && exit 0
            else
              uvx nox -s "$NOX_SESSION" && exit 0
            fi
          done
          exit 1
        env:
          # If no explicit nox-session is set, run the default tests for the chosen Python version
          NOX_SESSION: ${{ matrix.nox-session != '' && matrix.nox-session || format('test-{0}', matrix.python-version) }}
          TEST_FILTER: ${{ inputs.test-filter }}

      - name: "Upload coverage data"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.experimental }}-${{ matrix.nox-session }}
          path: ".coverage.*"
          if-no-files-found: error
          include-hidden-files: true


  coverage:
    # Disabled: `coverage report --fail-under=100` requires the full upstream
    # matrix, including the legs dropped above.
    if: false
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    needs: test
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: "Install uv"
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"

      - name: "Install coverage"
        # Install the same version of coverage as in the lock file.
        run: uv sync --dev --frozen

      - name: "Download coverage data"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: "Combine & check coverage"
        run: |
          uv run -m build
          uv run -m coverage combine
          uv run -m coverage html --skip-covered --skip-empty
          uv run -m coverage report --ignore-errors --show-missing --fail-under=100

      - if: ${{ failure() }}
        name: "Upload report if check failed"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: htmlcov
